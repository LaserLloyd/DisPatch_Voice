[project]
name = "dispatch-voice"
version = "0.1.0"
description = "Local voice cloning and speech for DisPatch Chat (Chatterbox-Turbo ONNX, CPU)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "huggingface_hub>=0.25",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Resemble's Perth watermark. Needs CPU torch; install with the pytorch-cpu index, never CUDA.
watermark = ["resemble-perth>=1.0.1", "torch>=2.6", "torchaudio>=2.6", "librosa>=0.10", "setuptools<81"]   # perth imports these without declaring them
serve = ["uvicorn[standard]>=0.30.0"]

[project.scripts]
dispatch-voice = "dispatch_voice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatch_voice"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "uvicorn[standard]>=0.30.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the downloaded Chatterbox ONNX models (slow, CPU-heavy)"]
