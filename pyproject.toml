[project]
name = "dispatch-voice"
version = "1.6.0"
description = "Voice chat for DisPatch Chat: the DisPatch Voice add-on (local speech, cloned voices, Chatterbox-Turbo ONNX on the CPU)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # The host-independent engines (STT, turn detection, TTS, providers, model downloads, the GPU-rig
    # client) are their own package, packages/forge-voice-core/ in this repository. It is declared as a
    # direct reference to that subdirectory so that a plain `pip install` / `uv pip install` of this project
    # (a git URL, an archive, an sdist or a wheel) resolves it with no path dependency and no extra step. The
    # archive form needs no git on the machine. RELEASE: change `refs/heads/main` to `refs/tags/vX.Y.Z` in the
    # commit that gets tagged, so that release always installs its own engines (tests/test_installable.py checks it).
    # `[tool.uv.sources]` below swaps in the in-tree copy for a checkout (`uv sync`, `uv pip install <dir>`).
    # The `speechforge` extra brings `websockets` for the rig client. See README "Install".
    "forge-voice-core[speechforge] @ https://github.com/LaserLloyd/DisPatch_Voice/archive/refs/heads/main.tar.gz#subdirectory=packages/forge-voice-core",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "websockets>=13.0",           # the GPU-rig client's transport (also declared by forge-voice-core[speechforge])
]

# Programs pip cannot install. `dispatch-voice doctor` and GET /api/voice/status check them and print
# the install command for the operating system (host/sysreq.py; a test keeps this table equal to it).
[tool.dispatch-voice.system-requirements]
ffmpeg = "decodes the voice clip you upload when you clone a voice (required for cloning)"
libopus = "the Opus codec of the low-bandwidth voice link (optional; without it the link stays PCM16)"

[project.urls]
Homepage = "https://github.com/LaserLloyd/DisPatch_Voice"

[project.optional-dependencies]
# Resemble's Perth watermark. Needs CPU torch; install with the pytorch-cpu index, never CUDA.
watermark = ["resemble-perth>=1.0.1", "torch>=2.6", "torchaudio>=2.6", "librosa>=0.10", "setuptools<81"]   # perth imports these without declaring them
serve = ["uvicorn[standard]>=0.30.0"]

[project.scripts]
dispatch-voice = "dispatch_voice.cli:main"

# DisPatch discovers the add-on through this entry point (EXT_API handshake, then setup).
[project.entry-points."dispatch.extensions"]
voice = "dispatch_voice:EXTENSION"

[tool.hatch.metadata]
# The forge-voice-core direct reference above.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Only what a build needs. Without this the sdist swallows every untracked folder (virtualenvs, node_modules,
# the scratch data dirs), which is slow and, with a virtualenv symlink in the tree, fails outright.
include = ["/src", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/CHANGELOG.md", "/VERSION"]

[tool.hatch.build.targets.wheel]
packages = ["src/dispatch_voice"]

[tool.uv.sources]
forge-voice-core = { path = "packages/forge-voice-core", editable = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0", "uvicorn[standard]>=0.30.0", "websockets>=13.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "models: needs the downloaded speech/Chatterbox models (slow, CPU-heavy; run under the models lock)",
    "contract: runs against a DisPatch backend checkout with the extension host (DISPATCH_BACKEND)",
    "interrupt_default: the session starts at the shipped interrupt sensitivity (normal), not the 1.4.0 rules (high)",
    "store_not_read: migrate_voice_yaml as this release ships it (voice.yaml is the only settings source)",
]
