[project]
name = "forge-voice-core"
version = "0.1.0"
description = "Host-independent voice engines: CPU speech-to-text, turn detection, Chatterbox-Turbo text-to-speech, provider interfaces, model downloads and the optional SpeechForge rig client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "onnx-asr>=0.12",
    "tokenizers>=0.20",
    "huggingface_hub>=0.25",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The GPU speech rig (SpeechForge, protocol sf.1): `forge_voice_core.rig` and the rig STT/TTS providers.
# Importing the package never needs it; the rig client imports `websockets` when it connects.
speechforge = ["websockets>=13.0"]
# Resemble's Perth watermark. Needs CPU torch; install with the pytorch-cpu index, never CUDA.
watermark = ["resemble-perth>=1.0.1", "torch>=2.6", "torchaudio>=2.6", "librosa>=0.10", "setuptools<81"]   # perth imports these without declaring them

# Programs pip cannot install. `forge_voice_core.sysreq.check()` reports them with the install command
# for the operating system (a test keeps this table equal to it).
[tool.forge-voice-core.system-requirements]
ffmpeg = "decodes the voice clip you upload when you clone a voice (required for cloning)"
libopus = "the Opus codec of the low-bandwidth voice link (optional; without it the link stays PCM16)"

[project.urls]
Homepage = "https://github.com/LaserLloyd/DisPatch_Voice"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_voice_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "models: needs the downloaded speech/Chatterbox models (slow, CPU-heavy; run under the models lock)",
]
