name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (the comment names its release):
# a moved tag cannot change what runs here. Bump them deliberately.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and blocks everything else: a change that would publish private
  # data fails here before anyone reviews it.
  privacy:
    name: No private data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: Scan the tree for private data
        run: python3 scripts/scrub_check.py

  test:
    name: Python tests (${{ matrix.python }})
    needs: privacy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Install system libraries the tests exercise
        # ffmpeg decodes uploaded clips (audio.decode); libopus0 is the Opus wire codec.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libopus0
      - name: Install uv
        # Pinned by commit like every action here (a moving tag is a supply-chain
        # hole); setup-uv no longer publishes moving major tags anyway.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync dependencies
        # No extras: the watermark extra pulls CPU torch, which CI does not need.
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Run the test suite
        # Model-backed tests skip themselves when the models are not downloaded;
        # tests/<area>/legacy/ (pre-split copies awaiting their port) is never collected.
        # DISPATCH_VOICE_REQUIRE_FFMPEG=1: a missing ffmpeg fails here instead of skipping.
        env:
          DISPATCH_VOICE_REQUIRE_FFMPEG: "1"
        run: uv run pytest -q
      - name: Run the forge-voice-core tests
        # The host-independent engines (packages/forge-voice-core) have their own suite and its own pytest
        # config; it includes the "imports without dispatch_voice / fastapi / starlette" guard.
        env:
          DISPATCH_VOICE_REQUIRE_FFMPEG: "1"
        run: uv run pytest -q packages/forge-voice-core/tests

  test-windows:
    name: Python tests (Windows, 3.12)
    needs: privacy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Install ffmpeg
        # Decodes uploaded clips (audio.decode). libopus has no package on the runner, so the
        # Opus wire tests skip here; Linux covers them.
        shell: bash
        run: choco install ffmpeg --no-progress -y
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync dependencies
        run: uv sync --frozen --python 3.12
      - name: Run the test suite
        # The same suite as Linux: file-mode checks become ACL checks (packages/forge-voice-core/src/forge_voice_core/fsperm.py),
        # every text file is read as UTF-8, waits are real time (tests/settling.py).
        shell: bash
        env:
          DISPATCH_VOICE_REQUIRE_FFMPEG: "1"
        run: uv run pytest -q
      - name: Run the forge-voice-core tests
        shell: bash
        env:
          DISPATCH_VOICE_REQUIRE_FFMPEG: "1"
        run: uv run pytest -q packages/forge-voice-core/tests

  client:
    name: Client tests
    needs: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Syntax check (every static module parses as ESM)
        run: |
          for f in src/dispatch_voice/static/*.js; do
            node --check "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done
      - name: Install test dependencies (jsdom only)
        run: npm install --no-audit --no-fund
      - name: node --test
        # test:ci sets CI_REQUIRE_DOM=1: a missing jsdom fails instead of skipping.
        run: npm run test:ci

  locales:
    name: Translations
    needs: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: HTML allowlist self-test
        run: python3 scripts/check-locales.py --selftest
      - name: Validate locale bundles
        run: python3 scripts/check-locales.py

  installable:
    name: Installable with plain pip
    needs: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Build the wheel and the sdist, pip install each into a clean venv, import
        # No path dependency: pip never reads [tool.uv.sources], so this is what a git URL, an archive or
        # a built artifact sees. Fails on "No matching distribution found for forge-voice-core".
        # The core comes from the git URL on main that pyproject.toml names.
        run: python3 scripts/check_installable.py
